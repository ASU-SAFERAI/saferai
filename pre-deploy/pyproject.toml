[build-system]
requires = ["setuptools>=61.0", "wheel", "build"]
build-backend = "setuptools.build_meta"

[project]
name = "pre-deploy"
dynamic = ["version"]
description = "Pre-Deploy LLM Evaluation Metrics Library"
authors = []
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "boto3==1.37.10",
    "botocore==1.37.10",
    "datasets==2.16.0",
    "deepdiff==8.6.1",
    "deepeval==3.3.9",
    "nltk==3.9.1",
    "numpy==1.26.4",
    "pyarrow==14.0.2",
    "pandas==2.2.3",
    "spacy==3.7.1"
]

[tool.setuptools.dynamic]
version = {attr = "version.__version__"}

[tool.setuptools.package-data]
pre_deploy = ["data/**/*.json"]

[tool.setuptools.packages.find]
include = ["pre_deploy*"]
